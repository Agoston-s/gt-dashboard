<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT Investment Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#efefef;font-family:'Courier New',monospace;font-size:10px;height:100vh;overflow:hidden}
.wrap{display:grid;grid-template-columns:230px 1fr;height:100vh;gap:1px;background:#1a1a1a}
.col{overflow-y:auto;padding:10px}
.left{background:#0a0a0a}
.mid{background:#0d0d0d}
.toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:1px}
.brand{font-size:11px;font-weight:700;letter-spacing:3px;color:#efefef}
.live-ind{display:flex;align-items:center;gap:4px;font-size:8px;color:#777;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:bl 2s infinite;flex-shrink:0}
.dot.loading{background:#f59e0b;animation:bl 0.5s infinite}
.dot.error{background:#ef4444;animation:none}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.15}}
.dateclock{font-size:8px;color:#555;margin-bottom:7px}
.portval{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1.05;color:#efefef}
.unit{font-size:10px;color:#555}
.pct{font-size:13px;font-weight:700}
.up{color:#22c55e}.dn{color:#ef4444}
.sub-stack{display:flex;flex-direction:column;gap:0;margin-bottom:8px;margin-top:3px}
.sub-line{font-size:9px;color:#555}
.div{border:none;border-top:1px solid #1a1a1a;margin:7px 0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:2px}
.pbox{background:#141414;border-radius:3px;padding:4px 6px}
.plbl{font-size:6px;color:#555;letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px}
.pval{font-size:11px;font-weight:700}
.pval small{font-size:8px;font-weight:400}
.stitle{font-size:7px;color:#2e2e2e;letter-spacing:1.2px;text-transform:uppercase;margin:7px 0 5px}
.idxrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #151515}
.idxname{font-size:10px;color:#666;letter-spacing:.3px}
.idxright{text-align:right}
.idxval{font-size:13px;font-weight:700;color:#efefef}
.idxchg{font-size:8px;margin-top:1px}
.chartblock{display:flex;gap:6px;align-items:center}
.legcol{flex:1;display:flex;flex-direction:column;gap:2px}
.legrow{display:flex;align-items:center;gap:4px}
.legdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.leglbl{flex:1;font-size:7px;text-transform:uppercase;letter-spacing:.3px;color:#666}
.legpct{font-weight:700;color:#efefef;font-size:8px;width:28px;text-align:right}
.r-title{font-size:7px;color:#2e2e2e;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px}
.col-heads{display:flex;align-items:center;padding:0 0 4px 6px;border-bottom:1px solid #1a1a1a;margin-bottom:1px}
.ch{font-size:6px;color:#2e2e2e;letter-spacing:.5px;text-transform:uppercase}
.c-ticker{width:46px;flex-shrink:0}
.c-name{flex:1;min-width:0}
.c-badge{width:44px;flex-shrink:0}
.c-price{width:82px;flex-shrink:0;text-align:right}
.c-abs{width:60px;flex-shrink:0;text-align:right}
.c-pct{width:58px;flex-shrink:0;text-align:right}
.stkrow{display:flex;align-items:center;padding:5px 0 5px 6px;border-bottom:1px solid #131313}
.stkrow.owned{border-left:2px solid #22c55e;padding-left:4px}
.stkt{font-size:11px;font-weight:700;letter-spacing:.3px;color:#efefef}
.stkname{font-size:8px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owned-badge{font-size:6px;border:1px solid #22c55e;color:#22c55e;border-radius:2px;padding:1px 2px;letter-spacing:.3px;white-space:nowrap}
.stkp{font-size:12px;font-weight:700;color:#efefef}
.stkabs{font-size:9px}
.stkpct{font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:flex-end;gap:2px}
.tri{font-size:8px}
.status-bar{font-size:7px;color:#333;margin-top:6px;text-align:right}
</style>
</head>
<body>
<div class="wrap">

<!-- LEFT PANEL -->
<div class="col left">
  <div class="toprow">
    <div class="brand">GT INVESTMENT</div>
    <div class="live-ind"><span class="dot" id="liveDot"></span><span id="liveLabel">LOADING</span></div>
  </div>
  <div class="dateclock" id="dc">—</div>

  <div style="margin-bottom:2px"><span class="portval" id="pv">—</span></div>
  <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
    <span class="unit">USD</span>
    <span class="pct" id="ppct">—</span>
  </div>
  <div class="sub-stack">
    <span class="sub-line" id="subFt">— Ft</span>
    <span class="sub-line" id="subEur">— EUR</span>
  </div>

  <div class="pgrid">
    <div class="pbox"><div class="plbl">Total P&amp;L</div><div class="pval" id="totalPl">—</div></div>
    <div class="pbox"><div class="plbl">Total ROI</div><div class="pval" id="totalRoi">—</div></div>
    <div class="pbox"><div class="plbl">Current P/L</div><div class="pval" id="currPl">—</div></div>
    <div class="pbox"><div class="plbl">Invested</div><div class="pval" id="invested">—</div></div>
  </div>

  <div class="div"></div>
  <div class="stitle">Indexes &amp; Commodities</div>
  <div id="idxList"><div style="color:#333;font-size:8px">Loading...</div></div>

  <div class="div"></div>
  <div class="stitle">Stock Allocation</div>
  <div class="chartblock">
    <canvas id="pieStock" width="66" height="66"></canvas>
    <div class="legcol" id="legStock"></div>
  </div>

  <div class="div"></div>
  <div class="stitle">Sector Allocation</div>
  <div class="chartblock">
    <canvas id="pieSector" width="66" height="66"></canvas>
    <div class="legcol" id="legSector"></div>
  </div>

  <div class="status-bar" id="statusBar">Initialising...</div>
</div>

<!-- RIGHT PANEL -->
<div class="col mid">
  <div class="r-title">Watchlist — All Stocks</div>
  <div class="col-heads">
    <div class="ch c-ticker">Ticker</div>
    <div class="ch c-name">Name</div>
    <div class="ch c-badge"></div>
    <div class="ch c-price" style="text-align:right">Price</div>
    <div class="ch c-abs" style="text-align:right">Change</div>
    <div class="ch c-pct" style="text-align:right">%</div>
  </div>
  <div id="stkList"><div style="color:#333;font-size:8px;padding:10px">Loading stocks...</div></div>
</div>

</div>

<script>
// ── CONFIG ───────────────────────────────────────────────────────────────────
const SHEETS_CSV = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTd0vs3Uy9TCIcY0fHdbq80Ykv9Bp5njHsZyCc1FLp-R5eQqZN2EujPsywbQrtK11A4jcuWGwh-bDWr/pub?gid=0&single=true&output=csv';
const REFRESH_MS = 60000; // 60 seconds

const ALL_TICKERS = ['TSLA','AAPL','AMZN','AVGO','KMB','JOBY','V','C','IONQ','JPM','GOOGL','META','NVDA','MRNA','SNOW'];
const INDEX_SYMS  = ['^VIX','GC=F','^GSPC','NDX'];
const INDEX_NAMES = {'^VIX':'VIX INDEX','GC=F':'XAU/USD (GOLD)','^GSPC':'S&P 500','NDX':'NDX 100'};

const STOCK_NAMES = {
  TSLA:'Tesla',AAPL:'Apple',AMZN:'Amazon',AVGO:'Broadcom',
  KMB:'Kimberly-Clark',JOBY:'Joby Aviation',V:'Visa',C:'Citigroup',
  IONQ:'IonQ',JPM:'JP Morgan',GOOGL:'Alphabet',META:'Meta',
  NVDA:'NVIDIA',MRNA:'Moderna',SNOW:'Snowflake'
};

const GREEN_RAMP = ['#14532d','#166534','#15803d','#16a34a','#22c55e','#4ade80'];
const GRAY_RAMP  = ['#525252','#737373','#a3a3a3','#d4d4d4','#e8e8e8'];

// ── STATE ────────────────────────────────────────────────────────────────────
let state = {
  totalPV: 0, totalProfit: 0, totalRoi: 0,
  currPl: 0, invested: 0,
  stocks: [
    {t:'TSLA', alloc:33.10},
    {t:'AMZN', alloc:27.36},
    {t:'AAPL', alloc:15.18},
    {t:'KMB',  alloc:11.43},
    {t:'MRNA', alloc: 7.11},
    {t:'JOBY', alloc: 5.82},
  ],
  sectors: [
    {label:'CONSUMER DISC.',   pct:60.46},
    {label:'INFO TECHNOLOGY',  pct:15.18},
    {label:'CONSUMER STAPLES', pct:11.43},
    {label:'HEALTH CARE',      pct: 7.11},
    {label:'INDUSTRIALS',      pct: 5.82},
  ]
};
let prices = {};

// ── UTILS ────────────────────────────────────────────────────────────────────
const fmt  = (n,d=2) => isNaN(n) ? '—' : n.toFixed(d).replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f');
const sgn  = n => n >= 0 ? '+' : '';
const cls  = n => n >= 0 ? 'up' : 'dn';
const arr  = n => n >= 0 ? '▲' : '▽';

function setDot(state){
  const d = document.getElementById('liveDot');
  const l = document.getElementById('liveLabel');
  d.className = 'dot' + (state === 'live' ? '' : ' ' + state);
  l.textContent = state === 'live' ? 'LIVE' : state === 'loading' ? 'UPDATING' : 'ERROR';
}

// ── FETCH GOOGLE SHEETS ──────────────────────────────────────────────────────
async function fetchSheets() {
  try {
    const res  = await fetch(SHEETS_CSV + '&cachebust=' + Date.now());
    const text = await res.text();
    parseCSV(text);
  } catch(e) {
    console.warn('Sheets error:', e);
  }
}

function parseCSV(csv) {
  const rows = csv.split('\n').map(r =>
    r.split(',').map(c => c.replace(/^"|"$/g,'').trim())
  );
  const num = s => parseFloat(s.replace(/[$%+\s]/g,'').replace(',','.')) || 0;

  rows.forEach(r => {
    const k = r[0];
    if (k === 'TOTAL PRESENT VALUE (PV)')  state.totalPV     = num(r[1]);
    if (k === 'TOTAL PROFIT ROI ($)')      state.totalProfit = num(r[1]);
    if (k === 'TOTAL PROFIT ROI (%)')      state.totalRoi    = num(r[1]);
    if (k === 'CURRENT P/L ')             state.currPl      = num(r[1]);
    if (k === 'TOTAL INVESTED')           state.invested    = num(r[1]);
  });

  // Stock allocations
  ['TSLA','AMZN','APPL','KMB','MRNA','JOBY'].forEach(raw => {
    const row = rows.find(r => r[0] === raw);
    if (!row) return;
    const ticker = raw === 'APPL' ? 'AAPL' : raw.trim();
    const idx = state.stocks.findIndex(s => s.t === ticker);
    if (idx >= 0) state.stocks[idx].alloc = num(row[7]);
  });

  // Sector allocations
  const sMap = {
    'Information Technology' : 'INFO TECHNOLOGY',
    'Consumer Discretionary' : 'CONSUMER DISC.',
    'Consumer Staples'       : 'CONSUMER STAPLES',
    'Health Care'            : 'HEALTH CARE',
    'Industrials'            : 'INDUSTRIALS',
  };
  rows.forEach(r => {
    const mapped = sMap[r[0]];
    if (mapped) {
      const pct = num(r[1]);
      const si = state.sectors.findIndex(s => s.label === mapped);
      if (si >= 0 && pct > 0) state.sectors[si].pct = pct;
    }
  });

  renderLeft();
  renderPies();
}

// ── FETCH YAHOO FINANCE ──────────────────────────────────────────────────────
async function tryFetch(url) {
  const proxies = [
    u => `https://api.allorigins.win/get?url=${encodeURIComponent(u)}&t=${Date.now()}`,
    u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
    u => `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(u)}`,
  ];
  for (const makeProxy of proxies) {
    try {
      const r = await fetch(makeProxy(url), {signal: AbortSignal.timeout(8000)});
      if (!r.ok) continue;
      const text = await r.text();
      // allorigins wraps in {contents:...}, others return raw
      try { const j = JSON.parse(text); if (j.contents) return j.contents; } catch(e) {}
      return text;
    } catch(e) { continue; }
  }
  throw new Error('All proxies failed');
}

async function fetchPrices() {
  setDot('loading');
  const allSyms = [...ALL_TICKERS, ...INDEX_SYMS].join('%2C');
  const yahooURL = `https://query1.finance.yahoo.com/v7/finance/quote?symbols=${allSyms}&fields=regularMarketPrice,regularMarketChange,regularMarketChangePercent,shortName`;

  try {
    const text   = await tryFetch(yahooURL);
    const data   = JSON.parse(text);
    const quotes = data?.quoteResponse?.result || [];

    quotes.forEach(q => {
      prices[q.symbol] = {
        p  : q.regularMarketPrice           || 0,
        c  : q.regularMarketChange          || 0,
        cp : q.regularMarketChangePercent   || 0,
      };
    });

    renderStocks();
    renderIndexes();
    setDot('live');
    document.getElementById('statusBar').textContent =
      'Last update: ' + new Date().toLocaleTimeString('en-GB') + ' — auto-refresh every 60s';
  } catch(e) {
    console.warn('Price fetch error:', e);
    setDot('error');
    document.getElementById('statusBar').textContent =
      'Price feed error — retrying in 60s';
    renderStocks();
  }
}

// ── RENDER LEFT ──────────────────────────────────────────────────────────────
function renderLeft() {
  document.getElementById('pv').textContent = fmt(state.totalPV);

  const pp = document.getElementById('ppct');
  pp.textContent = `${arr(state.totalRoi)} ${sgn(state.totalRoi)}${fmt(state.totalRoi)}%`;
  pp.className   = 'pct ' + cls(state.totalRoi);

  const USD_HUF = 365, USD_EUR = 0.92;
  document.getElementById('subFt').textContent  = fmt(state.totalPV * USD_HUF, 0) + ' Ft';
  document.getElementById('subEur').textContent = '€' + fmt(state.totalPV * USD_EUR);

  const tpl = document.getElementById('totalPl');
  tpl.textContent = `${sgn(state.totalProfit)}$${fmt(Math.abs(state.totalProfit))}`;
  tpl.className = 'pval ' + cls(state.totalProfit);

  const troi = document.getElementById('totalRoi');
  troi.textContent = `${sgn(state.totalRoi)}${fmt(state.totalRoi)}%`;
  troi.className = 'pval ' + cls(state.totalRoi);

  const cpl = document.getElementById('currPl');
  cpl.textContent = `${sgn(state.currPl)}$${fmt(Math.abs(state.currPl))}`;
  cpl.className = 'pval ' + cls(state.currPl);

  document.getElementById('invested').textContent = '$' + fmt(state.invested);
}

// ── RENDER INDEXES ───────────────────────────────────────────────────────────
function renderIndexes() {
  document.getElementById('idxList').innerHTML = INDEX_SYMS.map(sym => {
    const q = prices[sym];
    if (!q) return '';
    return `<div class="idxrow">
      <div class="idxname">${INDEX_NAMES[sym]}</div>
      <div class="idxright">
        <div class="idxval">${fmt(q.p)}</div>
        <div class="idxchg ${cls(q.c)}">${arr(q.c)} ${sgn(q.c)}${fmt(Math.abs(q.cp))}%&nbsp;${sgn(q.c)}${fmt(Math.abs(q.c))}</div>
      </div>
    </div>`;
  }).join('');
}

// ── RENDER STOCKS ────────────────────────────────────────────────────────────
function renderStocks() {
  const ownedSet = new Set(state.stocks.map(s => s.t));
  document.getElementById('stkList').innerHTML = ALL_TICKERS.map(t => {
    const q = prices[t] || {p:0, c:0, cp:0};
    const owned = ownedSet.has(t);
    return `<div class="stkrow${owned ? ' owned' : ''}">
      <div class="c-ticker stkt">${t}</div>
      <div class="c-name stkname">${STOCK_NAMES[t] || t}</div>
      <div class="c-badge">${owned ? '<span class="owned-badge">OWNED</span>' : ''}</div>
      <div class="c-price stkp">${q.p ? '$' + fmt(q.p) : '—'}</div>
      <div class="c-abs stkabs ${cls(q.c)}">${q.c ? sgn(q.c) + '$' + fmt(Math.abs(q.c)) : '—'}</div>
      <div class="c-pct stkpct ${cls(q.cp)}">
        <span class="tri">${q.cp ? arr(q.cp) : ''}</span>${q.cp ? fmt(Math.abs(q.cp)) + '%' : '—'}
      </div>
    </div>`;
  }).join('');
}

// ── RENDER PIE CHARTS ────────────────────────────────────────────────────────
function renderLeg(id, data, colors) {
  document.getElementById(id).innerHTML = data.map((d, i) => `
    <div class="legrow">
      <span class="legdot" style="background:${colors[i]}"></span>
      <span class="leglbl">${d.label || d.t}</span>
      <span class="legpct">${d.pct.toFixed(1)}%</span>
    </div>`).join('');
}

function makePie(id, data, colors) {
  const existing = Chart.getChart(id);
  if (existing) existing.destroy();
  return new Chart(document.getElementById(id).getContext('2d'), {
    type: 'doughnut',
    data: {
      labels: data.map(d => d.label || d.t),
      datasets: [{
        data: data.map(d => d.pct),
        backgroundColor: colors,
        borderWidth: 1.5,
        borderColor: '#0a0a0a',
        hoverOffset: 3
      }]
    },
    options: {
      responsive: false,
      cutout: '58%',
      plugins: { legend: { display: false }, tooltip: { enabled: false } }
    }
  });
}

function renderPies() {
  const sd = state.stocks.filter(s => s.alloc > 0);
  const sc = state.sectors.filter(s => s.pct  > 0);
  renderLeg('legStock',  sd, GREEN_RAMP);
  renderLeg('legSector', sc, GRAY_RAMP);
  setTimeout(() => {
    makePie('pieStock',  sd, GREEN_RAMP);
    makePie('pieSector', sc, GRAY_RAMP);
  }, 100);
}

// ── CLOCK ────────────────────────────────────────────────────────────────────
function clock() {
  const d = new Date();
  document.getElementById('dc').textContent =
    d.toLocaleDateString('en-GB', {year:'numeric',month:'2-digit',day:'2-digit'}) +
    ' ' + d.toLocaleTimeString('en-GB', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

// ── BOOT ─────────────────────────────────────────────────────────────────────
async function init() {
  clock();
  setInterval(clock, 1000);
  await fetchSheets();
  await fetchPrices();
  setInterval(async () => {
    await fetchSheets();
    await fetchPrices();
  }, REFRESH_MS);
}

init();
</script>
</body>
</html>
