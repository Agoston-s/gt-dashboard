<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT Investment Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#efefef;font-family:'Courier New',monospace;font-size:10px;height:100vh;overflow:hidden}
.wrap{display:grid;grid-template-columns:230px 1fr;height:100vh;gap:1px;background:#1a1a1a}
.col{overflow-y:auto;padding:10px}
.left{background:#0a0a0a}.mid{background:#0d0d0d}
.toprow{display:flex;justify-content:space-between;align-items:center;margin-bottom:1px}
.brand{font-size:11px;font-weight:700;letter-spacing:3px;color:#efefef}
.live-ind{display:flex;align-items:center;gap:4px;font-size:8px;color:#777;font-weight:700}
.dot{width:7px;height:7px;border-radius:50%;background:#22c55e;animation:bl 2s infinite;flex-shrink:0}
.dot.loading{background:#f59e0b;animation:bl .5s infinite}
.dot.error{background:#ef4444;animation:none}
@keyframes bl{0%,100%{opacity:1}50%{opacity:.15}}
.dc{font-size:8px;color:#555;margin-bottom:7px}
.portval{font-size:32px;font-weight:700;letter-spacing:-1px;line-height:1.05;color:#efefef}
.unit{font-size:10px;color:#555}
.pct{font-size:13px;font-weight:700}
.up{color:#22c55e}.dn{color:#ef4444}
.sub-stack{display:flex;flex-direction:column;margin-bottom:8px;margin-top:3px}
.sub-line{font-size:9px;color:#555}
.div{border:none;border-top:1px solid #1a1a1a;margin:7px 0}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:2px}
.pbox{background:#141414;border-radius:3px;padding:4px 6px}
.plbl{font-size:6px;color:#555;letter-spacing:.8px;text-transform:uppercase;margin-bottom:2px}
.pval{font-size:11px;font-weight:700}
.pval small{font-size:8px;font-weight:400}
.stitle{font-size:7px;color:#2e2e2e;letter-spacing:1.2px;text-transform:uppercase;margin:7px 0 5px}
.idxrow{display:flex;justify-content:space-between;align-items:center;padding:4px 0;border-bottom:1px solid #151515}
.idxname{font-size:10px;color:#666}
.idxright{text-align:right}
.idxval{font-size:13px;font-weight:700;color:#efefef}
.idxchg{font-size:8px;margin-top:1px}
.chartblock{display:flex;gap:6px;align-items:center}
.legcol{flex:1;display:flex;flex-direction:column;gap:2px}
.legrow{display:flex;align-items:center;gap:4px}
.legdot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.leglbl{flex:1;font-size:7px;text-transform:uppercase;letter-spacing:.3px;color:#666}
.legpct{font-weight:700;color:#efefef;font-size:8px;width:28px;text-align:right}
.r-title{font-size:7px;color:#2e2e2e;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:5px}
.col-heads{display:flex;align-items:center;padding:0 0 4px 6px;border-bottom:1px solid #1a1a1a;margin-bottom:1px}
.ch{font-size:6px;color:#2e2e2e;letter-spacing:.5px;text-transform:uppercase}
.c-ticker{width:46px;flex-shrink:0}
.c-name{flex:1;min-width:0}
.c-badge{width:44px;flex-shrink:0}
.c-price{width:82px;flex-shrink:0;text-align:right}
.c-abs{width:60px;flex-shrink:0;text-align:right}
.c-pct{width:58px;flex-shrink:0;text-align:right}
.stkrow{display:flex;align-items:center;padding:5px 0 5px 6px;border-bottom:1px solid #131313}
.stkrow.owned{border-left:2px solid #22c55e;padding-left:4px}
.stkt{font-size:11px;font-weight:700;color:#efefef}
.stkname{font-size:8px;color:#555;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.owned-badge{font-size:6px;border:1px solid #22c55e;color:#22c55e;border-radius:2px;padding:1px 2px;letter-spacing:.3px}
.stkp{font-size:12px;font-weight:700;color:#efefef}
.stkabs{font-size:9px}
.stkpct{font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:flex-end;gap:2px}
.tri{font-size:8px}
.statusbar{font-size:7px;color:#333;margin-top:6px;text-align:right}
</style>
</head>
<body>
<div class="wrap">
<div class="col left">
  <div class="toprow">
    <div class="brand">GT INVESTMENT</div>
    <div class="live-ind"><span class="dot" id="dot"></span><span id="lbl">LOADING</span></div>
  </div>
  <div class="dc" id="dc">--</div>
  <div style="margin-bottom:2px"><span class="portval" id="pv">--</span></div>
  <div style="display:flex;align-items:center;gap:6px;margin-bottom:3px">
    <span class="unit">USD</span><span class="pct" id="ppct">--</span>
  </div>
  <div class="sub-stack">
    <span class="sub-line" id="subFt">-- Ft</span>
    <span class="sub-line" id="subEur">-- EUR</span>
  </div>
  <div class="pgrid">
    <div class="pbox"><div class="plbl">Total P&L</div><div class="pval" id="tpl">--</div></div>
    <div class="pbox"><div class="plbl">Total ROI</div><div class="pval" id="troi">--</div></div>
    <div class="pbox"><div class="plbl">Current P/L</div><div class="pval" id="cpl">--</div></div>
    <div class="pbox"><div class="plbl">Invested</div><div class="pval" id="inv">--</div></div>
  </div>
  <div class="div"></div>
  <div class="stitle">Indexes & Commodities</div>
  <div id="idxList"><div style="color:#333;font-size:8px">Loading...</div></div>
  <div class="div"></div>
  <div class="stitle">Stock Allocation</div>
  <div class="chartblock">
    <canvas id="pieStock" width="66" height="66"></canvas>
    <div class="legcol" id="legStock"></div>
  </div>
  <div class="div"></div>
  <div class="stitle">Sector Allocation</div>
  <div class="chartblock">
    <canvas id="pieSector" width="66" height="66"></canvas>
    <div class="legcol" id="legSector"></div>
  </div>
  <div class="statusbar" id="sb">Connecting...</div>
</div>
<div class="col mid">
  <div class="r-title">Watchlist -- All Stocks</div>
  <div class="col-heads">
    <div class="ch c-ticker">Ticker</div>
    <div class="ch c-name">Name</div>
    <div class="ch c-badge"></div>
    <div class="ch c-price" style="text-align:right">Price</div>
    <div class="ch c-abs" style="text-align:right">Change</div>
    <div class="ch c-pct" style="text-align:right">%</div>
  </div>
  <div id="stkList"><div style="color:#333;font-size:8px;padding:10px">Loading...</div></div>
</div>
</div>
<script>
const SHEETS_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vTd0vs3Uy9TCIcY0fHdbq80Ykv9Bp5njHsZyCc1FLp-R5eQqZN2EujPsywbQrtK11A4jcuWGwh-bDWr/pub?gid=0&single=true&output=csv';
const ALL_TICKERS=['TSLA','AAPL','AMZN','AVGO','KMB','JOBY','V','C','IONQ','JPM','GOOGL','META','NVDA','MRNA','SNOW'];
const INDEX_SYMS=['^VIX','GC=F','^GSPC','NDX'];
const INDEX_NAMES={'^VIX':'VIX INDEX','GC=F':'XAU/USD (GOLD)','^GSPC':'S&P 500','NDX':'NDX 100'};
const NAMES={TSLA:'Tesla',AAPL:'Apple',AMZN:'Amazon',AVGO:'Broadcom',KMB:'Kimberly-Clark',JOBY:'Joby Aviation',V:'Visa',C:'Citigroup',IONQ:'IonQ',JPM:'JP Morgan',GOOGL:'Alphabet',META:'Meta',NVDA:'NVIDIA',MRNA:'Moderna',SNOW:'Snowflake'};
const GREEN=['#14532d','#166534','#15803d','#16a34a','#22c55e','#4ade80'];
const GRAY=['#525252','#737373','#a3a3a3','#d4d4d4','#e8e8e8'];
const owned=new Set(['TSLA','AMZN','AAPL','KMB','MRNA','JOBY']);

let state={totalPV:0,totalProfit:0,totalRoi:0,currPl:0,invested:0,
  stocks:[{t:'TSLA',pct:33.10},{t:'AMZN',pct:27.36},{t:'AAPL',pct:15.18},{t:'KMB',pct:11.43},{t:'MRNA',pct:7.11},{t:'JOBY',pct:5.82}],
  sectors:[{label:'CONSUMER DISC.',pct:60.46},{label:'INFO TECHNOLOGY',pct:15.18},{label:'CONSUMER STAPLES',pct:11.43},{label:'HEALTH CARE',pct:7.11},{label:'INDUSTRIALS',pct:5.82}]
};
let prices={};

const fmt=(n,d=2)=>isNaN(n)||n===0?'--':n.toFixed(d).replace(/\B(?=(\d{3})+(?!\d))/g,'\u202f');
const sgn=n=>n>=0?'+':'';
const cls=n=>n>=0?'up':'dn';
const arr=n=>n>=0?'▲':'▽';

function setDot(s){
  document.getElementById('dot').className='dot'+(s==='live'?'':' '+s);
  document.getElementById('lbl').textContent=s==='live'?'LIVE':s==='loading'?'UPDATING':'ERROR';
}
function clock(){
  const d=new Date();
  document.getElementById('dc').textContent=
    d.toLocaleDateString('en-GB',{year:'numeric',month:'2-digit',day:'2-digit'})+' '+
    d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
}

async function fetchSheets(){
  try{
    const r=await fetch(SHEETS_CSV+'&t='+Date.now());
    const txt=await r.text();
    const rows=txt.split('\n').map(r=>r.split(',').map(c=>c.replace(/^"|"$/g,'').trim()));
    const num=s=>parseFloat(s.replace(/[$%+\s]/g,'').replace(',','.'))||0;
    rows.forEach(r=>{
      if(r[0]==='TOTAL PRESENT VALUE (PV)'){const v=num(r[1]);state.totalPV=v;document.getElementById('pv').textContent=fmt(v);document.getElementById('subFt').textContent=fmt(v*365,0)+' Ft';document.getElementById('subEur').textContent='EUR '+fmt(v*0.92);}
      if(r[0]==='TOTAL PROFIT ROI ($)'){state.totalProfit=num(r[1]);}
      if(r[0]==='TOTAL PROFIT ROI (%)'){state.totalRoi=num(r[1]);}
      if(r[0]==='CURRENT P/L '){state.currPl=num(r[1]);}
      if(r[0]==='TOTAL INVESTED'){state.invested=num(r[1]);}
    });
    const pp=document.getElementById('ppct');pp.textContent=arr(state.totalRoi)+' '+sgn(state.totalRoi)+fmt(state.totalRoi)+'%';pp.className='pct '+cls(state.totalRoi);
    const tpl=document.getElementById('tpl');tpl.textContent=sgn(state.totalProfit)+'$'+fmt(Math.abs(state.totalProfit));tpl.className='pval '+cls(state.totalProfit);
    const troi=document.getElementById('troi');troi.textContent=sgn(state.totalRoi)+fmt(state.totalRoi)+'%';troi.className='pval '+cls(state.totalRoi);
    const cpl=document.getElementById('cpl');cpl.textContent=sgn(state.currPl)+'$'+fmt(Math.abs(state.currPl));cpl.className='pval '+cls(state.currPl);
    document.getElementById('inv').textContent='$'+fmt(state.invested);
    const sMap={'Information Technology':'INFO TECHNOLOGY','Consumer Discretionary':'CONSUMER DISC.','Consumer Staples':'CONSUMER STAPLES','Health Care':'HEALTH CARE','Industrials':'INDUSTRIALS'};
    rows.forEach(r=>{const m=sMap[r[0]];if(m){const v=parseFloat(r[1])||0;const i=state.sectors.findIndex(s=>s.label===m);if(i>=0&&v>0)state.sectors[i].pct=v;}});
    renderPies();
  }catch(e){console.warn('Sheets:',e);}
}

async function fetchPrices(){
  setDot('loading');
  const today=new Date().toISOString().split('T')[0];
  const allSyms=[...ALL_TICKERS,...INDEX_SYMS];
  const prompt='Today is '+today+'. Return ONLY a raw JSON object, no markdown, no explanation. Provide realistic current market prices for: '+allSyms.join(',')+'. Format: {"TSLA":{"p":177.90,"c":2.34,"cp":1.33},...} where p=price, c=change, cp=changePct. Include all symbols exactly as listed.';
  try{
    const resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:1000,messages:[{role:'user',content:prompt}]})
    });
    const data=await resp.json();
    const raw=data.content[0].text.replace(/```json|```/g,'').trim();
    const parsed=JSON.parse(raw);
    Object.assign(prices,parsed);
    renderStocks();renderIndexes();
    setDot('live');
    document.getElementById('sb').textContent='Last update: '+new Date().toLocaleTimeString('en-GB')+' -- auto-refresh 60s';
  }catch(e){
    console.warn('Prices:',e);setDot('error');
    document.getElementById('sb').textContent='Price feed error -- retrying in 60s';
    renderStocks();
  }
}

function renderIndexes(){
  document.getElementById('idxList').innerHTML=INDEX_SYMS.map(s=>{
    const q=prices[s];if(!q)return '';
    return '<div class="idxrow"><div class="idxname">'+INDEX_NAMES[s]+'</div><div class="idxright"><div class="idxval">'+fmt(q.p)+'</div><div class="idxchg '+cls(q.c)+'">'+arr(q.c)+' '+sgn(q.c)+fmt(Math.abs(q.cp))+'% '+sgn(q.c)+fmt(Math.abs(q.c))+'</div></div></div>';
  }).join('');
}

function renderStocks(){
  document.getElementById('stkList').innerHTML=ALL_TICKERS.map(t=>{
    const q=prices[t]||{p:0,c:0,cp:0};const o=owned.has(t);
    return '<div class="stkrow'+(o?' owned':'')+'"><div class="c-ticker stkt">'+t+'</div><div class="c-name stkname">'+NAMES[t]+'</div><div class="c-badge">'+(o?'<span class="owned-badge">OWNED</span>':'')+'</div><div class="c-price stkp">'+(q.p?'$'+fmt(q.p):'--')+'</div><div class="c-abs stkabs '+cls(q.c)+'">'+(q.c?sgn(q.c)+'$'+fmt(Math.abs(q.c)):'--')+'</div><div class="c-pct stkpct '+cls(q.cp)+'">'+(q.cp?arr(q.cp)+fmt(Math.abs(q.cp))+'%':'--')+'</div></div>';
  }).join('');
}

function renderLeg(id,data,colors){
  document.getElementById(id).innerHTML=data.map((d,i)=>'<div class="legrow"><span class="legdot" style="background:'+colors[i]+'"></span><span class="leglbl">'+(d.label||d.t)+'</span><span class="legpct">'+d.pct.toFixed(1)+'%</span></div>').join('');
}
function makePie(id,data,colors){
  const e=Chart.getChart(id);if(e)e.destroy();
  return new Chart(document.getElementById(id).getContext('2d'),{type:'doughnut',data:{labels:data.map(d=>d.label||d.t),datasets:[{data:data.map(d=>d.pct),backgroundColor:colors,borderWidth:1.5,borderColor:'#0a0a0a',hoverOffset:3}]},options:{responsive:false,cutout:'58%',plugins:{legend:{display:false},tooltip:{enabled:false}}}});
}
function renderPies(){
  renderLeg('legStock',state.stocks.filter(s=>s.pct>0),GREEN);
  renderLeg('legSector',state.sectors.filter(s=>s.pct>0),GRAY);
  setTimeout(()=>{makePie('pieStock',state.stocks.filter(s=>s.pct>0),GREEN);makePie('pieSector',state.sectors.filter(s=>s.pct>0),GRAY);},100);
}

async function refresh(){
  await fetchSheets();
  await fetchPrices();
}

clock();setInterval(clock,1000);
renderPies();renderStocks();
refresh();
setInterval(refresh,60000);
</script>
</body>
</html>
